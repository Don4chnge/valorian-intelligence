[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "valorian-intelligence"
version = "0.1.0"
description = "Drift detection and performance monitoring for production ML models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thabang Manyama" }]
keywords = [
    "machine-learning", "mlops", "drift-detection", "monitoring",
    "observability", "model-monitoring", "concept-drift",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The library itself needs only these. Streamlit is a dashboard concern and
# pytest a development one — forcing either on someone who just wants to call
# detect_drift() would be rude.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30", "plotly>=5.18"]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/Don4chnge/valorian-intelligence"
Repository = "https://github.com/Don4chnge/valorian-intelligence"
Dashboard = "https://valorian-intelligence.streamlit.app"

[tool.setuptools]
packages = ["valorian"]

[tool.pytest.ini_options]
pythonpath = ["."]
